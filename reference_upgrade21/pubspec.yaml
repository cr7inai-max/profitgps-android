name: profitgps_billing_app
description: Offline-first ProfitGPS retail billing, inventory, purchasing and business intelligence app for Android and Windows.
publish_to: 'none'
version: 0.9.0+9

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  pdf: ^3.11.3
  crypto: ^3.0.6
  uuid: ^4.5.1
  barcode_widget: ^2.0.4
  file_picker: ^8.1.7
  mobile_scanner: ^6.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/product_images/
