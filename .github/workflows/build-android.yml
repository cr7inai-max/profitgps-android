name: Build ProfitGPS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract ProfitGPS source
        shell: bash
        run: |
          set -euo pipefail
          test -f ProfitGPS_Android_Upgrade21_Native_Source.zip
          unzip -o ProfitGPS_Android_Upgrade21_Native_Source.zip
          mkdir -p assets/product_images
          touch assets/product_images/.keep

      - name: Apply Android CI source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/services/product_lookup_service.dart')
          s = p.read_text()
          s = s.replace("if (gtin != null) return _lookupTrustedMaster(gtin);", "if (gtin != null) return await _lookupTrustedMaster(gtin);")
          s = s.replace("|\\\\$)',\n        caseSensitive: false,", "|\\$)',\n        caseSensitive: false,")
          s = s.replace("        return _request(\n          nextMethod,", "        return await _request(\n          nextMethod,")
          p.write_text(s)
          PY

      - name: Create Android host
        run: flutter create . --platforms=android --org com.profitgps --project-name profitgps_billing_app

      - name: Ensure Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n'''
          if 'android.permission.CAMERA' not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'+perms)
          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Android compile SDK compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          files = []
          for folder in root.glob('file_picker-*'):
              files.extend(folder.glob('android/build.gradle'))
              files.extend(folder.glob('android/build.gradle.kts'))
          if not files:
              raise SystemExit('file_picker Android Gradle file not found')
          for p in files:
              s = p.read_text()
              original = s
              replacements = {
                  'compileSdk 34': 'compileSdk 36',
                  'compileSdkVersion 34': 'compileSdkVersion 36',
                  'compileSdk = 34': 'compileSdk = 36',
                  'compileSdkVersion = 34': 'compileSdkVersion = 36',
              }
              for old, new in replacements.items():
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s)
                  print(f'Updated {p} to compileSdk 36')
              else:
                  print(f'No compileSdk 34 literal found in {p}; leaving unchanged')
          PY

      - name: Analyze
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ProfitGPS_Android_Upgrade21_Native.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfitGPS-Android-Upgrade21-Native
          path: ProfitGPS_Android_Upgrade21_Native.apk
          if-no-files-found: error
          retention-days: 30
