name: Build ProfitGPS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract ProfitGPS source
        shell: bash
        run: |
          set -euo pipefail
          test -f ProfitGPS_Android_Upgrade21_Native_Source.zip
          unzip -o ProfitGPS_Android_Upgrade21_Native_Source.zip
          mkdir -p assets/product_images
          touch assets/product_images/.keep

      - name: Apply Android CI source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Existing Upgrade 21 source corrections.
          p = Path('lib/services/product_lookup_service.dart')
          s = p.read_text()
          s = s.replace("if (gtin != null) return _lookupTrustedMaster(gtin);", "if (gtin != null) return await _lookupTrustedMaster(gtin);")
          s = s.replace("|\\\\$)',\n        caseSensitive: false,", "|\\$)',\n        caseSensitive: false,")
          s = s.replace("        return _request(\n          nextMethod,", "        return await _request(\n          nextMethod,")
          p.write_text(s)

          # Upgrade the Android scanner to the current stable line. Recent
          # releases include Android CameraX initialization and lifecycle fixes.
          p = Path('pubspec.yaml')
          s = p.read_text()
          s = s.replace('mobile_scanner: ^6.0.11', 'mobile_scanner: ^7.4.2')
          p.write_text(s)

          # mobile_scanner 7.3+ uses a two-argument errorBuilder.
          p = Path('lib/widgets/barcode_input_dialog.dart')
          s = p.read_text()
          s = s.replace('errorBuilder: (context, error, child) => Center(', 'errorBuilder: (context, error) => Center(')

          # Avoid starting CameraX before the native preview is attached.
          s = s.replace('''  final MobileScannerController scannerController = MobileScannerController(\n    detectionSpeed: DetectionSpeed.noDuplicates,\n    autoStart: true,\n  );\n  bool returning = false;''', '''  final MobileScannerController scannerController = MobileScannerController(\n    detectionSpeed: DetectionSpeed.noDuplicates,\n    autoStart: false,\n  );\n  bool returning = false;\n  String? cameraStartError;\n\n  @override\n  void initState() {\n    super.initState();\n    WidgetsBinding.instance.addPostFrameCallback((_) async {\n      if (!mounted) return;\n      try {\n        await scannerController.start();\n      } catch (error) {\n        if (mounted) {\n          setState(() => cameraStartError = error.toString());\n        }\n      }\n    });\n  }''')

          # Show a useful retry control if a vendor camera service fails once.
          marker = '''      body: Stack(\n        fit: StackFit.expand,\n        children: ['''
          replacement = '''      body: Stack(\n        fit: StackFit.expand,\n        children: [\n          if (cameraStartError != null)\n            Center(\n              child: Padding(\n                padding: const EdgeInsets.all(24),\n                child: Column(\n                  mainAxisSize: MainAxisSize.min,\n                  children: [\n                    Text(\n                      'Camera scanner could not start.\\n$cameraStartError',\n                      textAlign: TextAlign.center,\n                      style: const TextStyle(color: Colors.white),\n                    ),\n                    const SizedBox(height: 16),\n                    FilledButton.icon(\n                      onPressed: () async {\n                        setState(() => cameraStartError = null);\n                        try {\n                          await scannerController.stop();\n                        } catch (_) {}\n                        await Future<void>.delayed(const Duration(milliseconds: 250));\n                        try {\n                          await scannerController.start();\n                        } catch (error) {\n                          if (mounted) setState(() => cameraStartError = error.toString());\n                        }\n                      },\n                      icon: const Icon(Icons.refresh_rounded),\n                      label: const Text('Retry camera'),\n                    ),\n                  ],\n                ),\n              ),\n            ),'''
          s = s.replace(marker, replacement)
          p.write_text(s)
          PY

      - name: Create Android host
        run: flutter create . --platforms=android --org com.profitgps --project-name profitgps_billing_app

      - name: Ensure Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'''
          if 'android.permission.CAMERA' not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'+perms)
          elif 'android.hardware.camera' not in s:
              s=s.replace('<uses-permission android:name="android.permission.INTERNET" />', '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />')
          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Android compile SDK compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          files = []
          for folder in root.glob('file_picker-*'):
              files.extend(folder.glob('android/build.gradle'))
              files.extend(folder.glob('android/build.gradle.kts'))
          if not files:
              raise SystemExit('file_picker Android Gradle file not found')
          for p in files:
              s = p.read_text()
              original = s
              replacements = {
                  'compileSdk 34': 'compileSdk 36',
                  'compileSdkVersion 34': 'compileSdkVersion 36',
                  'compileSdk = 34': 'compileSdk = 36',
                  'compileSdkVersion = 34': 'compileSdkVersion = 36',
              }
              for old, new in replacements.items():
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s)
                  print(f'Updated {p} to compileSdk 36')
              else:
                  print(f'No compileSdk 34 literal found in {p}; leaving unchanged')
          PY

      - name: Analyze
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ProfitGPS_Android_Upgrade21_Native_CameraFix.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfitGPS-Android-Upgrade21-Native-CameraFix
          path: ProfitGPS_Android_Upgrade21_Native_CameraFix.apk
          if-no-files-found: error
          retention-days: 30
