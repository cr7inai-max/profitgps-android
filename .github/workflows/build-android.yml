name: Build ProfitGPS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reconstruct ProfitGPS source
        shell: bash
        run: |
          set -euo pipefail
          cat source_chunks/*.part > profitgps_source.b64
          base64 -d profitgps_source.b64 > profitgps_source.tar.xz
          tar -xJf profitgps_source.tar.xz
          rm -f profitgps_source.b64 profitgps_source.tar.xz

      - name: Create Android host
        run: flutter create . --platforms=android --org com.profitgps --project-name profitgps_billing_app

      - name: Ensure Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n'''
          if 'android.permission.CAMERA' not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'+perms)
          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ProfitGPS_Android_Upgrade21_Native.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfitGPS-Android-Upgrade21-Native
          path: ProfitGPS_Android_Upgrade21_Native.apk
          if-no-files-found: error
          retention-days: 30
