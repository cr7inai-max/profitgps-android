name: Build ProfitGPS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: profitgps-android-stable-test-signing-v1

      - name: Ensure stable Android test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ProfitGPS Android Test,O=ProfitGPS,C=IN"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract ProfitGPS Upgrade 21 source
        shell: bash
        run: |
          set -euo pipefail
          test -f ProfitGPS_Android_Upgrade21_Native_Source.zip
          unzip -o ProfitGPS_Android_Upgrade21_Native_Source.zip
          mkdir -p assets/product_images
          touch assets/product_images/.keep

      - name: Apply mobile baseline
        run: python3 mobile_overlay/apply_mobile_baseline.py

      - name: Apply screenshot-first v0.11 parity pass
        shell: bash
        run: |
          python3 mobile_overlay/apply_v011.py
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('lib').rglob('*.dart'):
              s = p.read_text()
              s = s.replace('const AppTheme.surface2', 'AppTheme.surface2')
              s = s.replace('const AppTheme.surface', 'AppTheme.surface')
              s = s.replace('const AppTheme.border', 'AppTheme.border')
              p.write_text(s)
          PY

      - name: Apply Android scanner and source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/services/product_lookup_service.dart')
          s = p.read_text()
          s = s.replace("if (gtin != null) return _lookupTrustedMaster(gtin);", "if (gtin != null) return await _lookupTrustedMaster(gtin);")
          s = s.replace("|\\\\$)',\n        caseSensitive: false,", "|\\$)',\n        caseSensitive: false,")
          s = s.replace("        return _request(\n          nextMethod,", "        return await _request(\n          nextMethod,")
          p.write_text(s)

          p = Path('pubspec.yaml')
          s = p.read_text()
          s = s.replace('mobile_scanner: ^6.0.11', 'mobile_scanner: ^7.4.2')
          p.write_text(s)

          p = Path('lib/widgets/barcode_input_dialog.dart')
          s = p.read_text()
          s = s.replace('errorBuilder: (context, error, child) => Center(', 'errorBuilder: (context, error) => Center(')
          s = s.replace('''  final MobileScannerController scannerController = MobileScannerController(\n    detectionSpeed: DetectionSpeed.noDuplicates,\n    autoStart: true,\n  );\n  bool returning = false;''', '''  final MobileScannerController scannerController = MobileScannerController(\n    detectionSpeed: DetectionSpeed.noDuplicates,\n    autoStart: false,\n  );\n  bool returning = false;\n  String? cameraStartError;\n\n  @override\n  void initState() {\n    super.initState();\n    WidgetsBinding.instance.addPostFrameCallback((_) async {\n      if (!mounted) return;\n      try {\n        await scannerController.start();\n      } catch (error) {\n        if (mounted) setState(() => cameraStartError = error.toString());\n      }\n    });\n  }''')
          marker = '''      body: Stack(\n        fit: StackFit.expand,\n        children: ['''
          replacement = '''      body: Stack(\n        fit: StackFit.expand,\n        children: [\n          if (cameraStartError != null)\n            Center(\n              child: Padding(\n                padding: const EdgeInsets.all(24),\n                child: Column(\n                  mainAxisSize: MainAxisSize.min,\n                  children: [\n                    Text('Camera scanner could not start.\\n$cameraStartError', textAlign: TextAlign.center, style: const TextStyle(color: Colors.white)),\n                    const SizedBox(height: 16),\n                    FilledButton.icon(\n                      onPressed: () async {\n                        setState(() => cameraStartError = null);\n                        try { await scannerController.stop(); } catch (_) {}\n                        await Future<void>.delayed(const Duration(milliseconds: 250));\n                        try { await scannerController.start(); } catch (error) { if (mounted) setState(() => cameraStartError = error.toString()); }\n                      },\n                      icon: const Icon(Icons.refresh_rounded),\n                      label: const Text('Retry camera'),\n                    ),\n                  ],\n                ),\n              ),\n            ),'''
          s = s.replace(marker, replacement)
          p.write_text(s)
          PY

      - name: Create Android host
        run: flutter create . --platforms=android --org com.profitgps --project-name profitgps_billing_app

      - name: Set stable Android package identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.profitgps.android"', s)
          gradle.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = re.sub(r'android:label="[^"]+"', 'android:label="ProfitGPS"', s, count=1)
          manifest.write_text(s)
          PY

      - name: Ensure Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = '''    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'''
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + perms)
          elif 'android.hardware.camera' not in s:
              s = s.replace('<uses-permission android:name="android.permission.INTERNET" />', '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />')
          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Android compile SDK compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          files = []
          for folder in root.glob('file_picker-*'):
              files.extend(folder.glob('android/build.gradle'))
              files.extend(folder.glob('android/build.gradle.kts'))
          for p in files:
              s = p.read_text()
              for old, new in {
                  'compileSdk 34': 'compileSdk 36',
                  'compileSdkVersion 34': 'compileSdkVersion 36',
                  'compileSdk = 34': 'compileSdk = 36',
                  'compileSdkVersion = 34': 'compileSdkVersion = 36',
              }.items():
                  s = s.replace(old, new)
              p.write_text(s)
          PY

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=0.11.${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ProfitGPS_Android_Mobile_v0.11_Screenshot_Parity.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfitGPS-Android-Mobile-v0.11-Screenshot-Parity
          path: ProfitGPS_Android_Mobile_v0.11_Screenshot_Parity.apk
          if-no-files-found: error
          retention-days: 30
